[project]
name = "bing-ads-mcp"
version = "0.1.0"
description = "Microsoft Advertising MCP: SDK-wide API access, reports, and campaign changes."
readme = "README.md"
requires-python = ">=3.15"
license = "MIT"
dependencies = [
  "fastmcp==4.1.0",
  "msads==13.0.30",
  "httpx==0.28.1",
  "pydantic==2.14.1",
  "python-dotenv==1.2.4",
]

[dependency-groups]
dev = ["pytest==9.1.1", "pytest-asyncio==1.4.0", "ruff==0.17.0"]

[project.scripts]
bing-ads-login = "bing_ads_mcp.auth:main"
bing-ads-mcp = "bing_ads_mcp.server:main"

[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["bing_ads_mcp*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = ["live: opt-in read-only Microsoft Advertising integration tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
